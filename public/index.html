<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jam Sync">
  <title>Jam Sync</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Tela inicial -->
  <main id="home" class="screen">
    <div class="brand">
      <img src="/icon.svg" alt="" width="72" height="72">
      <h1>Jam Sync</h1>
      <p class="muted">Ouçam juntos — cada um no seu Spotify ou YouTube Music.</p>
    </div>
    <label class="field">
      <span>Seu nome</span>
      <input id="nameInput" maxlength="30" autocomplete="nickname" placeholder="Como os outros vão te ver">
    </label>
    <button id="createBtn" class="btn primary">Criar uma jam</button>
    <div class="divider"><span>ou</span></div>
    <div class="join-row">
      <input id="codeInput" maxlength="4" placeholder="CÓDIGO" autocapitalize="characters" autocomplete="off">
      <button id="joinBtn" class="btn">Entrar</button>
    </div>
    <p id="homeError" class="error" hidden></p>
  </main>

  <!-- Sala -->
  <main id="room" class="screen" hidden>
    <header class="topbar">
      <button id="leaveBtn" class="icon-btn" aria-label="Sair da sala">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="shareBtn" class="code-chip" aria-label="Compartilhar sala">
        <span class="muted">Sala</span> <strong id="roomCode">----</strong>
        <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
      </button>
      <span id="connDot" class="conn-dot" title="Conexão"></span>
    </header>

    <section class="now">
      <div class="media">
        <img id="art" alt="" hidden>
        <div id="ytWrap" hidden><div id="ytPlayer"></div></div>
        <div id="ytHint" class="yt-hint" hidden>Toque no vídeo para liberar o som</div>
        <div id="emptyArt" class="empty-art">♪</div>
      </div>
      <div class="meta">
        <div id="title" class="title">Nada tocando</div>
        <div id="artist" class="muted">Adicione músicas na aba Buscar</div>
      </div>
      <div class="progress">
        <div id="bar" class="bar"><div id="barFill"></div></div>
        <div class="times muted"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="controls">
        <button id="prevBtn" class="icon-btn" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7z"/></svg></button>
        <button id="playBtn" class="play-btn" aria-label="Tocar/pausar">
          <svg id="icPlay" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg id="icPause" viewBox="0 0 24 24" hidden><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
      </div>
    </section>

    <section class="listen">
      <div class="label muted">Ouvindo por</div>
      <div class="segmented" role="radiogroup">
        <button data-platform="spotify" class="seg spotify">Spotify</button>
        <button data-platform="youtube" class="seg youtube">YouTube</button>
        <button data-platform="none" class="seg">Só controlar</button>
      </div>
      <div id="platformStatus" class="status"></div>
    </section>

    <nav class="tabs">
      <button data-tab="queue" class="tab active">Fila</button>
      <button data-tab="search" class="tab">Buscar</button>
      <button data-tab="people" class="tab">Pessoas <span id="peopleCount"></span></button>
    </nav>

    <section id="tab-queue" class="tab-panel">
      <ol id="queueList" class="list"></ol>
      <p id="queueEmpty" class="muted center">A fila está vazia.</p>
    </section>

    <section id="tab-search" class="tab-panel" hidden>
      <form id="searchForm" class="search-row">
        <input id="searchInput" type="search" placeholder="Música, artista ou link do YouTube" enterkeyhint="search">
        <button class="btn primary" type="submit">Buscar</button>
      </form>
      <div class="segmented small" id="sourceSeg">
        <button data-source="spotify" class="seg spotify">no Spotify</button>
        <button data-source="youtube" class="seg youtube">no YouTube</button>
      </div>
      <p class="hint muted" id="sourceHint"></p>
      <ul id="searchList" class="list"></ul>
    </section>

    <section id="tab-people" class="tab-panel" hidden>
      <ul id="peopleList" class="list"></ul>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
